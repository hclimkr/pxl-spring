name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the in-flight run for that branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (JDK 17)
    # While the repository is private, only run on demand — an automatic push/PR run would burn
    # private-repo Actions minutes. The push/pull_request triggers above stay in place: once the
    # repository is made public this condition starts evaluating true on its own and automatic runs
    # resume, so there is nothing to edit at that point.
    if: github.event_name == 'workflow_dispatch' || github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Builds both modules: pxl-spring-javax (release 8) and pxl-spring-jakarta (release 17,
      # sources generated by string substitution from the sibling module).
      - name: Build and test both modules
        run: mvn -B -ntp clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          retention-days: 7
          if-no-files-found: ignore
